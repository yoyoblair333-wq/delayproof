<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-labelledby="t d"><title id="t">Money coming back</title><desc id="d">An opt-in payer card sends 400 euros along a curved arrow back to the passenger's boarding-pass stub. Test mode: no real money.</desc><rect width="560" height="420" fill="#0B1422"/><circle cx="280.0" cy="216.0" r="176" fill="#16233A"/><rect x="58" y="128" width="170" height="112" rx="16" fill="#121D2F" stroke="#24324A" stroke-width="1.5"/><text x="76" y="156" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.6" text-anchor="start" fill="#9AA6B8" >OPT-IN PAYER</text><path d="M92 176 l18 -7 l18 7 v14 c0 12 -8 20 -18 24 c-10 -4 -18 -12 -18 -24 z" fill="#7FA6FF"/><path d="M102 190 l6 6 l10 -11" fill="none" stroke="#121D2F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="190" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="0" text-anchor="start" fill="#F3EFE6" >Insurer, card</text><text x="140" y="208" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="0" text-anchor="start" fill="#F3EFE6" >or travel group</text><defs><mask id="pstub"><rect x="320" y="110" width="200" height="150" fill="#fff"/><circle cx="322" cy="185" r="12" fill="#000"/><circle cx="518" cy="185" r="12" fill="#000"/></mask></defs><rect x="322" y="112" width="196" height="146" rx="18" fill="#F7F3EC" mask="url(#pstub)" stroke="#0F1B2D" stroke-opacity="0.1"/><text x="342" y="140" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2" text-anchor="start" fill="#5B6676" >YOUR STUB · XX 123</text><text x="340" y="200" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="54" font-weight="900" letter-spacing="-2" text-anchor="start" fill="#9A5B00" >€400</text><line x1="342" y1="216" x2="498" y2="216" stroke="#0F1B2D" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="1.5 6" stroke-linecap="round"/><circle cx="352" cy="236" r="7" fill="#127A4F"/><text x="366" y="241" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="0" text-anchor="start" fill="#0F1B2D" >Paid on the ruling</text><path d="M180 120 C 220 40, 360 34, 404 98" fill="none" stroke="#F2A93B" stroke-width="5" stroke-linecap="round"/><path d="M392 92 L408 106 L414 84" fill="none" stroke="#F2A93B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="232" cy="70" r="17" fill="#F2A93B"/><circle cx="232" cy="70" r="11.5" fill="none" stroke="#0F1B2D" stroke-opacity="0.35" stroke-width="2"/><text x="232" y="75.5" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="800" font-size="15" text-anchor="middle" fill="#0F1B2D">€</text><circle cx="292" cy="56" r="17" fill="#F2A93B"/><circle cx="292" cy="56" r="11.5" fill="none" stroke="#0F1B2D" stroke-opacity="0.35" stroke-width="2"/><text x="292" y="61.5" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="800" font-size="15" text-anchor="middle" fill="#0F1B2D">€</text><rect x="166" y="282" width="228" height="30" rx="15" fill="none" stroke="#7FA6FF" stroke-width="1.5"/><text x="280" y="302" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10.5" font-weight="500" letter-spacing="0.8" text-anchor="middle" fill="#7FA6FF" >TEST MODE · NO REAL MONEY</text><text x="280.0" y="352" font-family="Inter, sans-serif" font-size="16" font-weight="600" letter-spacing="0" text-anchor="middle" fill="#F3EFE6" >When someone has opted in, it pays by itself.</text><text x="280.0" y="376" font-family="Inter, sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="middle" fill="#9AA6B8" >No letter, no chasing.</text></svg>