<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="t d">
  <title id="t">How much could you be owed?</title>
  <desc id="d">Three ticket-stub columns sized by amount: up to 1,500 km €250 (UK £220); 1,500 to 3,500 km €400 (UK £350); over 3,500 km €600 (UK £520), for arrivals 3+ hours late.</desc>
  <defs>
    <radialGradient id="bg" cx="18%" cy="8%" r="110%">
      <stop offset="0" stop-color="#18304F"/><stop offset="0.55" stop-color="#0E1A2C"/><stop offset="1" stop-color="#08101C"/>
    </radialGradient>
    <mask id="stub"><rect width="56" height="56" fill="#fff"/><circle cx="4" cy="28" r="4.2" fill="#000"/><circle cx="52" cy="28" r="4.2" fill="#000"/></mask>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect x="40" y="40" width="1000" height="1270" rx="44" fill="none" stroke="#F7F3EC" stroke-opacity="0.08" stroke-width="2"/>
  <g transform="translate(80,84)">
    <rect x="4" y="12" width="48" height="36" rx="8" fill="#F2A93B" mask="url(#stub)"/>
    <path d="M16.5 29.5 L24.5 37 L39.5 21.5" fill="none" stroke="#0F1B2D" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="44.5" cy="16.5" r="2.8" fill="#0F1B2D"/>
  </g>
  <text x="150" y="125" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="800" font-size="38" letter-spacing="-1" fill="#F7F3EC">Delay<tspan fill="#F2A93B">Proof</tspan></text>
  <text x="1000" y="125" text-anchor="end" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="20" letter-spacing="3" fill="#9AA6B8">PER PASSENGER</text>
  <text x="80" y="270" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="900" font-size="96" letter-spacing="-4" fill="#F7F3EC">How much could</text>
  <text x="80" y="370" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="900" font-size="96" letter-spacing="-4" fill="#F7F3EC">you be <tspan fill="#F2A93B">owed?</tspan></text>
  <text x="80" y="438" font-family="Inter, sans-serif" font-size="30" fill="#C9D1DD">If you landed 3+ hours late. Set by flight distance,</text>
  <text x="80" y="478" font-family="Inter, sans-serif" font-size="30" fill="#C9D1DD">not by what you paid for the ticket.</text>
  <line x1="80" y1="1000" x2="1000" y2="1000" stroke="#F7F3EC" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M80.0 1000 V828.5 Q80.0 812.5 96.0 812.5 H294.0 Q310.0 812.5 310.0 828.5 V1000 Z" fill="#F2A93B"/>
  <circle cx="80.0" cy="882.5" r="12" fill="#0E1A2C"/><circle cx="310.0" cy="882.5" r="12" fill="#0E1A2C"/>
  <line x1="102.0" y1="882.5" x2="288.0" y2="882.5" stroke="#0F1B2D" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="195.0" y="864.5" text-anchor="middle" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="18" letter-spacing="2" fill="#0F1B2D">EU 261</text>
  <text x="195.0" y="962.5" text-anchor="middle" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="900" font-size="72" letter-spacing="-3" fill="#0F1B2D">€250</text>
  <text x="195.0" y="1050" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="26" fill="#F7F3EC">Up to 1,500 km</text>
  <text x="195.0" y="1084" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" fill="#9AA6B8">short hops</text>
  <text x="195.0" y="1124" text-anchor="middle" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="22" letter-spacing="1" fill="#F7F3EC">UK  £220</text>
  <path d="M425.0 1000 V716.0 Q425.0 700.0 441.0 700.0 H639.0 Q655.0 700.0 655.0 716.0 V1000 Z" fill="#F2A93B"/>
  <circle cx="425.0" cy="770.0" r="12" fill="#0E1A2C"/><circle cx="655.0" cy="770.0" r="12" fill="#0E1A2C"/>
  <line x1="447.0" y1="770.0" x2="633.0" y2="770.0" stroke="#0F1B2D" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="540.0" y="752.0" text-anchor="middle" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="18" letter-spacing="2" fill="#0F1B2D">EU 261</text>
  <text x="540.0" y="850.0" text-anchor="middle" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="900" font-size="72" letter-spacing="-3" fill="#0F1B2D">€400</text>
  <text x="540.0" y="1050" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="26" fill="#F7F3EC">1,500 – 3,500 km</text>
  <text x="540.0" y="1084" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" fill="#9AA6B8">e.g. LIS → AMS</text>
  <text x="540.0" y="1124" text-anchor="middle" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="22" letter-spacing="1" fill="#F7F3EC">UK  £350</text>
  <path d="M770.0 1000 V566.0 Q770.0 550.0 786.0 550.0 H984.0 Q1000.0 550.0 1000.0 566.0 V1000 Z" fill="#F2A93B"/>
  <circle cx="770.0" cy="620.0" r="12" fill="#0E1A2C"/><circle cx="1000.0" cy="620.0" r="12" fill="#0E1A2C"/>
  <line x1="792.0" y1="620.0" x2="978.0" y2="620.0" stroke="#0F1B2D" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="885.0" y="602.0" text-anchor="middle" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="18" letter-spacing="2" fill="#0F1B2D">EU 261</text>
  <text x="885.0" y="700.0" text-anchor="middle" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="900" font-size="72" letter-spacing="-3" fill="#0F1B2D">€600</text>
  <text x="885.0" y="1050" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="26" fill="#F7F3EC">Over 3,500 km</text>
  <text x="885.0" y="1084" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" fill="#9AA6B8">long-haul</text>
  <text x="885.0" y="1124" text-anchor="middle" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="22" letter-spacing="1" fill="#F7F3EC">UK  £520</text>
  <line x1="80" y1="1186" x2="1000" y2="1186" stroke="#F7F3EC" stroke-opacity="0.12" stroke-width="2"/>
  <g font-family="Inter, sans-serif" font-size="17" fill="#9AA6B8">
    <text x="80" y="1218">Within the EU, flights over 3,500 km pay €400. Long-haul 3–4h late pays €300 / £260. Can be halved</text>
    <text x="80" y="1242">if a reroute gets you there close to the original time. Not owed if the airline shows extraordinary</text>
    <text x="80" y="1266">circumstances. Sources: Reg. (EC) 261/2004 Art. 7; UK CAA. Information, not legal advice.</text>
  </g>

</svg>
