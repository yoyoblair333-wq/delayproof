  <g transform="translate(872,470)">
    <circle r="118" fill="none" stroke="#F2A93B" stroke-opacity="0.55" stroke-width="2"/>
    <circle r="72" fill="none" stroke="#F2A93B" stroke-opacity="0.35" stroke-width="1.5"/>
