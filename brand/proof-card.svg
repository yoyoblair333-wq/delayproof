0" y="89.4" transform="rotate(162.0 29.0 89.4)" text-anchor="middle" dominant-baseline="central">S</text><text x="14.7" y="92.8" transform="rotate(171.0 14.7 92.8)" text-anchor="middle" dominant-baseline="central">U</text><text x="0.0" y="94.0" transform="rotate(180.0 0.0 94.0)" text-anchor="middle" dominant-baseline="central">S</text><text x="-29.0" y="89.4" transform="rotate(198.0 -29.0 89.4)" text-anchor="middle" dominant-baseline="central">&#183;</text><text x="-55.3" y="76.0" transform="rotate(216.0 -55.3 76.0)" text-anchor="middle" dominant-baseline="central">P</text><text x="-66.5" y="66.5" transform="rotate(225.0 -66.5 66.5)" text-anchor="middle" dominant-baseline="central">U</text><text x="-76.0" y="55.3" transform="rotate(234.0 -76.0 55.3)" text-anchor="middle" dominant-baseline="central">B</text><text x="-83.8" y="42.7" transform="rotate(243.0 -83.8 42.7)" text-anchor="middle" dominant-baseline="central">L</text><text x="-89.4" y="29.0" transform="rotate(252.0 -89.4 29.0)" text-anchor="middle" dominant-baseline="central">I</text><text x="-92.8" y="14.7" transform="rotate(261.0 -92.8 14.7)" text-anchor="middle" dominant-baseline="central">C</text><text x="-92.8" y="-14.7" transform="rotate(279.0 -92.8 -14.7)" text-anchor="middle" dominant-baseline="central">R</text><text x="-89.4" y="-29.0" transform="rotate(288.0 -89.4 -29.0)" text-anchor="middle" dominant-baseline="central">E</text><text x="-83.8" y="-42.7" transform="rotate(297.0 -83.8 -42.7)" text-anchor="middle" dominant-baseline="central">C</text><text x="-76.0" y="-55.3" transform="rotate(306.0 -76.0 -55.3)" text-anchor="middle" dominant-baseline="central">O</text><text x="-66.5" y="-66.5" transform="rotate(315.0 -66.5 -66.5)" text-anchor="middle" dominant-baseline="central">R</text><text x="-55.3" y="-76.0" transform="rotate(324.0 -55.3 -76.0)" text-anchor="middle" dominant-baseline="central">D</text><text x="-29.0" y="-89.4" transform="rotate(342.0 -29.0 -89.4)" text-anchor="middle" dominant-baseline="central">&#183;</text></g>
    <g transform="translate(-40,-40) scale(0.15625)">
      <rect x="40" y="96" width="432" height="320" rx="64" fill="#F2A93B"/>
      <path d="M150 262 L222 328 L356 188" fill="none" stroke="#0F1B2D" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="398" cy="146" r="24" fill="#0F1B2D"/>
    </g>
  </g>

  <!-- ticket -->
  <g mask="url(#ticket)">
    <rect x="80" y="704" width="920" height="370" rx="32" fill="#F7F3EC"/>
  </g>
  <line x1="122" y1="888" x2="958" y2="888" stroke="#0F1B2D" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>

  <text x="128" y="812" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="800" font-size="88" letter-spacing="-1" fill="#0F1B2D">LIS</text>
  <text x="130" y="850" font-family="Inter, sans-serif" font-size="26" fill="#5B6676">Lisbon</text>
  <text x="952" y="812" text-anchor="end" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="800" font-size="88" letter-spacing="-1" fill="#0F1B2D">AMS</text>
  <text x="950" y="850" text-anchor="end" font-family="Inter, sans-serif" font-size="26" fill="#5B6676">Amsterdam</text>
  <!-- route -->
  <path d="M330 790 Q530 712 720 790" fill="none" stroke="#0F1B2D" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="330" cy="790" r="7" fill="#0F1B2D"/>
  <circle cx="720" cy="790" r="9" fill="#F2A93B" stroke="#0F1B2D" stroke-width="3"/>
  <text x="525" y="800" text-anchor="middle" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="20" letter-spacing="2" fill="#9A5B00">ARRIVED LATE</text>

  <!-- facts -->
  <g font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="19" letter-spacing="2" fill="#5B6676">
    <text x="128" y="958">FLIGHT</text>
    <text x="335" y="958">DATE</text>
    <text x="565" y="958">ARRIVAL DELAY</text>
    <text x="800" y="958">DISTANCE</text>
  </g>
  <g font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="700" font-size="38" fill="#0F1B2D">
    <text x="128" y="1010">XX 123</text>
    <text x="335" y="1010">14 Oct 26</text>
    <text x="565" y="1010" fill="#B4400A">3h 47m</text>
    <text x="800" y="1010">1,858 km</text>
  </g>
  <text x="128" y="1048" font-family="Inter, sans-serif" font-size="21" fill="#5B6676">Sched. 14:05 · Actual 17:52 · Cause: no extraordinary circumstance found</text>

  <!-- consensus -->
  <g transform="translate(80,1128)">
    <g fill="#3CCB8A">
      <circle cx="18" cy="18" r="18"/><circle cx="62" cy="18" r="18"/><circle cx="106" cy="18" r="18"/><circle cx="150" cy="18" r="18"/><circle cx="194" cy="18" r="18"/>
    </g>
    <g fill="none" stroke="#08101C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 18 l5 5 l10 -10"/><path d="M54 18 l5 5 l10 -10"/><path d="M98 18 l5 5 l10 -10"/><path d="M142 18 l5 5 l10 -10"/><path d="M186 18 l5 5 l10 -10"/>
    </g>
    <text x="236" y="29" font-family="Inter, sans-serif" font-weight="600" font-size="30" fill="#F7F3EC">5 of 5 independent validators agreed</text>
    <text x="0" y="84" font-family="Inter, sans-serif" font-size="25" fill="#9AA6B8">Public record · open to appeal until 6 Nov 2026</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="1226" x2="1000" y2="1226" stroke="#F7F3EC" stroke-opacity="0.12" stroke-width="2"/>
  <text x="80" y="1262" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="22" fill="#F2A93B">delayproof.app/r/DP-00412</text>
  <text x="1000" y="1262" text-anchor="end" font-family="Inter, sans-serif" font-weight="600" font-size="20" fill="#C9D1DD">Check the record yourself →</text>
  <text x="80" y="1292" font-family="Inter, sans-serif" font-size="18" fill="#7D8899">Information, not legal advice. Airlines aren’t legally bound by this ruling. Testnet: no real funds.</text>
</svg>
