<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="t d">
  <title id="t">DelayProof proof card</title>
  <desc id="d">Shareable ruling card: the network ruled the passenger is owed 400 euros for flight XX 123, Lisbon to Amsterdam, arrived 3 hours 47 minutes late. Five of five validators agreed. Sample data.</desc>
  <!--
    TEMPLATE FIELDS (replace at render time):
    {{RULING_ID}} DP-00412 · {{AMOUNT}} €400 · {{RULE}} EU 261/2004 · {{FROM}} LIS / Lisbon · {{TO}} AMS / Amsterdam
    {{FLIGHT}} XX 123 · {{DATE}} 14 Oct 2026 · {{DELAY}} 3h 47m · {{DISTANCE}} 1,858 km
    {{AGREE}} 5 of 5 · {{APPEAL_UNTIL}} 6 Nov 2026 · {{URL}} delayproof.app/r/DP-00412
    Fonts: Schibsted Grotesk (display), Inter (UI), IBM Plex Mono (data; falls back to DejaVu Sans Mono).
  -->
  <defs>
    <radialGradient id="bg" cx="18%" cy="8%" r="110%">
      <stop offset="0" stop-color="#18304F"/>
      <stop offset="0.55" stop-color="#0E1A2C"/>
      <stop offset="1" stop-color="#08101C"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2A93B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>
    <mask id="stub">
      <rect width="56" height="56" fill="#fff"/>
      <circle cx="4" cy="28" r="4.2" fill="#000"/>
      <circle cx="52" cy="28" r="4.2" fill="#000"/>
    </mask>
    <mask id="ticket">
      <rect width="1080" height="1350" fill="#fff"/>
      <circle cx="80" cy="888" r="26" fill="#000"/>
      <circle cx="1000" cy="888" r="26" fill="#000"/>
    </mask>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <ellipse cx="300" cy="520" rx="420" ry="240" fill="url(#glow)"/>
  <!-- hairline frame -->
  <rect x="40" y="40" width="1000" height="1270" rx="44" fill="none" stroke="#F7F3EC" stroke-opacity="0.08" stroke-width="2"/>

  <!-- header -->
  <g transform="translate(80,84)">
    <rect x="4" y="12" width="48" height="36" rx="8" fill="#F2A93B" mask="url(#stub)"/>
    <path d="M16.5 29.5 L24.5 37 L39.5 21.5" fill="none" stroke="#0F1B2D" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="44.5" cy="16.5" r="2.8" fill="#0F1B2D"/>
  </g>
  <text x="150" y="125" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="800" font-size="38" letter-spacing="-1" fill="#F7F3EC">DelayProof</text>
  <text x="1000" y="108" text-anchor="end" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="20" letter-spacing="3" fill="#F2A93B">PUBLIC RULING</text>
  <text x="1000" y="138" text-anchor="end" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="22" fill="#9AA6B8">#DP-00412</text>

  <!-- verdict -->
  <text x="80" y="262" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="26" letter-spacing="6" fill="#9AA6B8">THE NETWORK RULED</text>
  <text x="76" y="360" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.5" fill="#F7F3EC">You’re owed</text>
  <text x="66" y="598" font-family="Schibsted Grotesk, Inter, sans-serif" font-weight="900" font-size="270" letter-spacing="-10" fill="#F2A93B">€400</text>
  <text x="82" y="654" font-family="Inter, sans-serif" font-size="30" fill="#C9D1DD">per passenger · under EU 261/2004</text>

